services:
  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-routeplan}
      POSTGRES_USER: ${POSTGRES_USER:-routeplan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-routeplan-local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - routeplan-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Development-only mailbox. SMTP stays internal; the UI is bound to the local machine.
  mailpit:
    image: axllent/mailpit:v1.27.4
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8026}:8025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_MAX_AGE: 24h
      MP_DISABLE_VERSION_CHECK: "true"

  backend:
    build:
      context: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-routeplan}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-routeplan}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-routeplan-local}
      ROUTEPLAN_PLACE_PROVIDER: ${ROUTEPLAN_PLACE_PROVIDER:-DISABLED}
      ROUTEPLAN_AI_PROVIDER: ${ROUTEPLAN_AI_PROVIDER:-RULE_BASED}
      ROUTEPLAN_ROUTE_PROVIDER: ${ROUTEPLAN_ROUTE_PROVIDER:-SIMPLE}
      ROUTEPLAN_ROUTE_CACHE_ENABLED: ${ROUTEPLAN_ROUTE_CACHE_ENABLED:-false}
      ROUTEPLAN_ROUTE_DB_CACHE_ENABLED: ${ROUTEPLAN_ROUTE_DB_CACHE_ENABLED:-${ROUTEPLAN_ROUTE_CACHE_ENABLED:-false}}
      ROUTEPLAN_ROUTE_CACHE_KEY_PREFIX: ${ROUTEPLAN_ROUTE_CACHE_KEY_PREFIX:-routeplan:route:v1}
      ROUTEPLAN_ROUTE_CACHE_WALKING_TTL: ${ROUTEPLAN_ROUTE_CACHE_WALKING_TTL:-7d}
      ROUTEPLAN_ROUTE_CACHE_DRIVING_TTL: ${ROUTEPLAN_ROUTE_CACHE_DRIVING_TTL:-15m}
      ROUTEPLAN_ROUTE_CACHE_TRANSIT_TTL: ${ROUTEPLAN_ROUTE_CACHE_TRANSIT_TTL:-5m}
      ROUTEPLAN_ROUTE_CACHE_REFRESH_LOCK_TTL: ${ROUTEPLAN_ROUTE_CACHE_REFRESH_LOCK_TTL:-15s}
      ROUTEPLAN_ROUTE_CACHE_REFRESH_WAIT: ${ROUTEPLAN_ROUTE_CACHE_REFRESH_WAIT:-2s}
      ROUTEPLAN_ROUTE_CACHE_REFRESH_POLL_INTERVAL: ${ROUTEPLAN_ROUTE_CACHE_REFRESH_POLL_INTERVAL:-100ms}
      ROUTEPLAN_ROUTE_CACHE_DEPARTURE_BUCKET: ${ROUTEPLAN_ROUTE_CACHE_DEPARTURE_BUCKET:-15m}
      ROUTEPLAN_ROUTE_CACHE_DATABASE_BATCH_SIZE: ${ROUTEPLAN_ROUTE_CACHE_DATABASE_BATCH_SIZE:-500}
      ROUTEPLAN_ROUTE_CACHE_CLEANUP_INTERVAL: ${ROUTEPLAN_ROUTE_CACHE_CLEANUP_INTERVAL:-10m}
      ROUTEPLAN_ROUTE_CACHE_CLEANUP_BATCH_SIZE: ${ROUTEPLAN_ROUTE_CACHE_CLEANUP_BATCH_SIZE:-5000}
      ROUTEPLAN_TIME_DEPENDENT_GLOBAL_ENABLED: ${ROUTEPLAN_TIME_DEPENDENT_GLOBAL_ENABLED:-false}
      ROUTEPLAN_TIME_DEPENDENT_BUCKET: ${ROUTEPLAN_TIME_DEPENDENT_BUCKET:-1h}
      ROUTEPLAN_TIME_DEPENDENT_MAX_CANDIDATES: ${ROUTEPLAN_TIME_DEPENDENT_MAX_CANDIDATES:-8}
      ROUTEPLAN_TIME_DEPENDENT_MAX_DAYS: ${ROUTEPLAN_TIME_DEPENDENT_MAX_DAYS:-3}
      ROUTEPLAN_TIME_DEPENDENT_MAX_MATRIX_BUILDS: ${ROUTEPLAN_TIME_DEPENDENT_MAX_MATRIX_BUILDS:-36}
      ROUTEPLAN_TIME_DEPENDENT_MAX_MATRIX_ELEMENTS: ${ROUTEPLAN_TIME_DEPENDENT_MAX_MATRIX_ELEMENTS:-2500}
      ROUTEPLAN_TIME_DEPENDENT_BEAM_WIDTH: ${ROUTEPLAN_TIME_DEPENDENT_BEAM_WIDTH:-512}
      ROUTEPLAN_TIME_DEPENDENT_MAX_STATES: ${ROUTEPLAN_TIME_DEPENDENT_MAX_STATES:-250000}
      ROUTEPLAN_TIME_DEPENDENT_MAX_SEARCH_DURATION: ${ROUTEPLAN_TIME_DEPENDENT_MAX_SEARCH_DURATION:-5s}
      ROUTEPLAN_EXTERNAL_RETRY_ENABLED: ${ROUTEPLAN_EXTERNAL_RETRY_ENABLED:-true}
      ROUTEPLAN_EXTERNAL_RETRY_MAX_ATTEMPTS: ${ROUTEPLAN_EXTERNAL_RETRY_MAX_ATTEMPTS:-3}
      ROUTEPLAN_EXTERNAL_RETRY_INITIAL_DELAY: ${ROUTEPLAN_EXTERNAL_RETRY_INITIAL_DELAY:-200ms}
      ROUTEPLAN_EXTERNAL_RETRY_MAX_DELAY: ${ROUTEPLAN_EXTERNAL_RETRY_MAX_DELAY:-2s}
      ROUTEPLAN_EXTERNAL_RETRY_MULTIPLIER: ${ROUTEPLAN_EXTERNAL_RETRY_MULTIPLIER:-2.0}
      ROUTEPLAN_EXTERNAL_RETRY_JITTER: ${ROUTEPLAN_EXTERNAL_RETRY_JITTER:-0.2}
      ROUTEPLAN_EXTERNAL_RESILIENCE_ENABLED: ${ROUTEPLAN_EXTERNAL_RESILIENCE_ENABLED:-true}
      ROUTEPLAN_CIRCUIT_FAILURE_THRESHOLD: ${ROUTEPLAN_CIRCUIT_FAILURE_THRESHOLD:-5}
      ROUTEPLAN_CIRCUIT_OPEN_DURATION: ${ROUTEPLAN_CIRCUIT_OPEN_DURATION:-30s}
      ROUTEPLAN_PROVIDER_MAX_CONCURRENT_CALLS: ${ROUTEPLAN_PROVIDER_MAX_CONCURRENT_CALLS:-20}
      ROUTEPLAN_FAILURE_RATE_MINIMUM_CALLS: ${ROUTEPLAN_FAILURE_RATE_MINIMUM_CALLS:-5}
      ROUTEPLAN_FAILURE_RATE_WARNING_PERCENT: ${ROUTEPLAN_FAILURE_RATE_WARNING_PERCENT:-50}
      ROUTEPLAN_SESSION_TIMEOUT: ${ROUTEPLAN_SESSION_TIMEOUT:-12h}
      ROUTEPLAN_AUTH_MAIL_MODE: ${ROUTEPLAN_AUTH_MAIL_MODE:-LOCAL}
      ROUTEPLAN_PUBLIC_URL: ${ROUTEPLAN_PUBLIC_URL:-http://localhost:3100}
      ROUTEPLAN_AUTH_TRUSTED_PROXIES: ${ROUTEPLAN_AUTH_TRUSTED_PROXIES:-}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_SSL: ${SMTP_SSL:-false}
      SMTP_FROM: ${SMTP_FROM:-RoutePlan <noreply@routeplan.local>}
      ROUTEPLAN_WEATHER_AUTO_REFRESH_ENABLED: ${ROUTEPLAN_WEATHER_AUTO_REFRESH_ENABLED:-true}
      ROUTEPLAN_SESSION_COOKIE_SECURE: ${ROUTEPLAN_SESSION_COOKIE_SECURE:-false}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      GOOGLE_MAPS_BROWSER_KEY: ${GOOGLE_MAPS_BROWSER_KEY:-}
      GOOGLE_MONTHLY_SEARCH_LIMIT: ${GOOGLE_MONTHLY_SEARCH_LIMIT:-4000}
      GOOGLE_MONTHLY_DETAILS_LIMIT: ${GOOGLE_MONTHLY_DETAILS_LIMIT:-900}
      GOOGLE_MONTHLY_MATRIX_LIMIT: ${GOOGLE_MONTHLY_MATRIX_LIMIT:-9000}
      GOOGLE_MONTHLY_GEOMETRY_LIMIT: ${GOOGLE_MONTHLY_GEOMETRY_LIMIT:-9000}
      ROUTEPLAN_USAGE_WARNING_PERCENT: ${ROUTEPLAN_USAGE_WARNING_PERCENT:-80}
      OPENAI_MONTHLY_REQUEST_LIMIT: ${OPENAI_MONTHLY_REQUEST_LIMIT:-500}
      OPENAI_MONTHLY_TOKEN_LIMIT: ${OPENAI_MONTHLY_TOKEN_LIMIT:-1000000}
      GOOGLE_PLACES_USD_PER_THOUSAND: ${GOOGLE_PLACES_USD_PER_THOUSAND:-0}
      GOOGLE_PLACE_DETAILS_USD_PER_THOUSAND: ${GOOGLE_PLACE_DETAILS_USD_PER_THOUSAND:-0}
      GOOGLE_ROUTES_USD_PER_THOUSAND: ${GOOGLE_ROUTES_USD_PER_THOUSAND:-0}
      GOOGLE_GEOMETRY_USD_PER_THOUSAND: ${GOOGLE_GEOMETRY_USD_PER_THOUSAND:-0}
      OPENAI_INPUT_USD_PER_MILLION: ${OPENAI_INPUT_USD_PER_MILLION:-0}
      OPENAI_OUTPUT_USD_PER_MILLION: ${OPENAI_OUTPUT_USD_PER_MILLION:-0}
      GOOGLE_MONTHLY_BUDGET_USD: ${GOOGLE_MONTHLY_BUDGET_USD:-0}
      OPENAI_MONTHLY_BUDGET_USD: ${OPENAI_MONTHLY_BUDGET_USD:-0}
      ROUTEPLAN_MODERATOR_EMAILS: ${ROUTEPLAN_MODERATOR_EMAILS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "${BACKEND_PORT:-8180}:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-3100}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  routeplan-postgres-data:
