services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-routeplan}
      POSTGRES_USER: ${POSTGRES_USER:-routeplan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-routeplan-local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - routeplan-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-routeplan}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-routeplan}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-routeplan-local}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  routeplan-postgres-data:
