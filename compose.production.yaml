name: routeplan-production

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - routeplan-production-postgres:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - routeplan-production-redis:/data
    networks:
      - data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12
    security_opt:
      - no-new-privileges:true

  backend:
    image: ${ROUTEPLAN_IMAGE_PREFIX:?ROUTEPLAN_IMAGE_PREFIX is required}-backend:${ROUTEPLAN_IMAGE_TAG:?ROUTEPLAN_IMAGE_TAG is required}
    restart: unless-stopped
    env_file:
      - ${ROUTEPLAN_ENV_FILE:-.env.production}
    environment:
      SPRING_PROFILES_ACTIVE: production
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ROUTEPLAN_AUTH_TRUSTED_PROXIES: 172.30.241.0/24
      ROUTEPLAN_SESSION_COOKIE_SECURE: "true"
    expose:
      - "8080"
    networks:
      - app
      - data
      - outbound
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  frontend:
    image: ${ROUTEPLAN_IMAGE_PREFIX:?ROUTEPLAN_IMAGE_PREFIX is required}-frontend:${ROUTEPLAN_IMAGE_TAG:?ROUTEPLAN_IMAGE_TAG is required}
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - edge
      - app
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 12
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m,uid=101,gid=101,mode=0750
      - /var/run:size=1m,uid=101,gid=101,mode=0750
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    image: caddy:2.11.3-alpine
    restart: unless-stopped
    environment:
      ROUTEPLAN_DOMAIN: ${ROUTEPLAN_DOMAIN:?ROUTEPLAN_DOMAIN is required}
      TLS_EMAIL: ${TLS_EMAIL:?TLS_EMAIL is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - routeplan-production-caddy-data:/data
      - routeplan-production-caddy-config:/config
    networks:
      - edge
    depends_on:
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 12
    read_only: true
    tmpfs:
      - /tmp:size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

volumes:
  routeplan-production-postgres:
  routeplan-production-redis:
  routeplan-production-caddy-data:
  routeplan-production-caddy-config:

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.240.0/24
  app:
    internal: true
    ipam:
      config:
        - subnet: 172.30.241.0/24
  data:
    internal: true
    ipam:
      config:
        - subnet: 172.30.242.0/24
  outbound:
    ipam:
      config:
        - subnet: 172.30.243.0/24
