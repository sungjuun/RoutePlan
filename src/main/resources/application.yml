spring:
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  application:
    name: routeplan
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/routeplan}
    username: ${SPRING_DATASOURCE_USERNAME:routeplan}
    password: ${SPRING_DATASOURCE_PASSWORD:routeplan-local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  session:
    jdbc:
      initialize-schema: never
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    default-encoding: UTF-8
    properties:
      "[mail.smtp.auth]": ${SMTP_AUTH:false}
      "[mail.smtp.starttls.enable]": ${SMTP_STARTTLS:false}
      "[mail.smtp.starttls.required]": ${SMTP_STARTTLS:false}
      "[mail.smtp.ssl.enable]": ${SMTP_SSL:false}
      "[mail.smtp.ssl.checkserveridentity]": true
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 500ms
      timeout: 500ms

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  shutdown: graceful
  servlet:
    session:
      timeout: ${ROUTEPLAN_SESSION_TIMEOUT:12h}
      cookie:
        name: ROUTEPLAN_SESSION
        http-only: true
        secure: ${ROUTEPLAN_SESSION_COOKIE_SECURE:false}
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  health:
    mail:
      enabled: false
    redis:
      enabled: false
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: ${spring.application.name}
    description: Constraint-aware travel route planning platform

logging:
  pattern:
    level: "%5p [cid:%X{correlationId:-none}]"

routeplan:
  auth:
    mail-mode: ${ROUTEPLAN_AUTH_MAIL_MODE:DISABLED}
    public-url: ${ROUTEPLAN_PUBLIC_URL:http://localhost:3100}
    mail-from: ${SMTP_FROM:RoutePlan <noreply@routeplan.local>}
    trusted-proxies: ${ROUTEPLAN_AUTH_TRUSTED_PROXIES:}
  community:
    moderator-emails: ${ROUTEPLAN_MODERATOR_EMAILS:}
  external:
    retry:
      enabled: ${ROUTEPLAN_EXTERNAL_RETRY_ENABLED:true}
      max-attempts: ${ROUTEPLAN_EXTERNAL_RETRY_MAX_ATTEMPTS:3}
      initial-delay: ${ROUTEPLAN_EXTERNAL_RETRY_INITIAL_DELAY:200ms}
      max-delay: ${ROUTEPLAN_EXTERNAL_RETRY_MAX_DELAY:2s}
      multiplier: ${ROUTEPLAN_EXTERNAL_RETRY_MULTIPLIER:2.0}
      jitter: ${ROUTEPLAN_EXTERNAL_RETRY_JITTER:0.2}
    resilience:
      enabled: ${ROUTEPLAN_EXTERNAL_RESILIENCE_ENABLED:true}
      failure-threshold: ${ROUTEPLAN_CIRCUIT_FAILURE_THRESHOLD:5}
      open-duration: ${ROUTEPLAN_CIRCUIT_OPEN_DURATION:30s}
      max-concurrent-calls: ${ROUTEPLAN_PROVIDER_MAX_CONCURRENT_CALLS:20}
      failure-rate-minimum-calls: ${ROUTEPLAN_FAILURE_RATE_MINIMUM_CALLS:5}
      failure-rate-warning-percent: ${ROUTEPLAN_FAILURE_RATE_WARNING_PERCENT:50}
    usage:
      metrics-refresh-interval: ${ROUTEPLAN_USAGE_METRICS_REFRESH_INTERVAL:1m}
      warning-percent: ${ROUTEPLAN_USAGE_WARNING_PERCENT:80}
      open-ai-monthly-request-limit: ${OPENAI_MONTHLY_REQUEST_LIMIT:500}
      open-ai-monthly-token-limit: ${OPENAI_MONTHLY_TOKEN_LIMIT:1000000}
      google-places-usd-per-thousand: ${GOOGLE_PLACES_USD_PER_THOUSAND:0}
      google-place-details-usd-per-thousand: ${GOOGLE_PLACE_DETAILS_USD_PER_THOUSAND:0}
      google-routes-usd-per-thousand: ${GOOGLE_ROUTES_USD_PER_THOUSAND:0}
      google-geometry-usd-per-thousand: ${GOOGLE_GEOMETRY_USD_PER_THOUSAND:0}
      open-ai-input-usd-per-million: ${OPENAI_INPUT_USD_PER_MILLION:0}
      open-ai-output-usd-per-million: ${OPENAI_OUTPUT_USD_PER_MILLION:0}
      google-monthly-budget-usd: ${GOOGLE_MONTHLY_BUDGET_USD:0}
      open-ai-monthly-budget-usd: ${OPENAI_MONTHLY_BUDGET_USD:0}
  ai:
    provider: ${ROUTEPLAN_AI_PROVIDER:RULE_BASED}
  exchange:
    provider: ${ROUTEPLAN_EXCHANGE_PROVIDER:FRANKFURTER}
    base-url: ${ROUTEPLAN_EXCHANGE_BASE_URL:https://api.frankfurter.dev}
    request-timeout: ${ROUTEPLAN_EXCHANGE_REQUEST_TIMEOUT:5s}
    cache-ttl: ${ROUTEPLAN_EXCHANGE_CACHE_TTL:6h}
  place:
    provider: ${ROUTEPLAN_PLACE_PROVIDER:DISABLED}
  route:
    provider: ${ROUTEPLAN_ROUTE_PROVIDER:SIMPLE}
    cache:
      enabled: ${ROUTEPLAN_ROUTE_CACHE_ENABLED:false}
      persistent-enabled: ${ROUTEPLAN_ROUTE_DB_CACHE_ENABLED:${ROUTEPLAN_ROUTE_CACHE_ENABLED:false}}
      key-prefix: ${ROUTEPLAN_ROUTE_CACHE_KEY_PREFIX:routeplan:route:v1}
      walking-ttl: ${ROUTEPLAN_ROUTE_CACHE_WALKING_TTL:7d}
      driving-ttl: ${ROUTEPLAN_ROUTE_CACHE_DRIVING_TTL:15m}
      transit-ttl: ${ROUTEPLAN_ROUTE_CACHE_TRANSIT_TTL:5m}
      refresh-lock-ttl: ${ROUTEPLAN_ROUTE_CACHE_REFRESH_LOCK_TTL:15s}
      refresh-wait: ${ROUTEPLAN_ROUTE_CACHE_REFRESH_WAIT:2s}
      refresh-poll-interval: ${ROUTEPLAN_ROUTE_CACHE_REFRESH_POLL_INTERVAL:100ms}
      departure-bucket: ${ROUTEPLAN_ROUTE_CACHE_DEPARTURE_BUCKET:15m}
      database-batch-size: ${ROUTEPLAN_ROUTE_CACHE_DATABASE_BATCH_SIZE:500}
      cleanup-interval: ${ROUTEPLAN_ROUTE_CACHE_CLEANUP_INTERVAL:10m}
      cleanup-batch-size: ${ROUTEPLAN_ROUTE_CACHE_CLEANUP_BATCH_SIZE:5000}
  optimization:
    time-dependent:
      enabled: ${ROUTEPLAN_TIME_DEPENDENT_GLOBAL_ENABLED:false}
      bucket: ${ROUTEPLAN_TIME_DEPENDENT_BUCKET:1h}
      max-candidates: ${ROUTEPLAN_TIME_DEPENDENT_MAX_CANDIDATES:8}
      max-days: ${ROUTEPLAN_TIME_DEPENDENT_MAX_DAYS:3}
      max-matrix-builds: ${ROUTEPLAN_TIME_DEPENDENT_MAX_MATRIX_BUILDS:36}
      max-matrix-elements: ${ROUTEPLAN_TIME_DEPENDENT_MAX_MATRIX_ELEMENTS:2500}
      beam-width: ${ROUTEPLAN_TIME_DEPENDENT_BEAM_WIDTH:128}
      max-evaluated-states: ${ROUTEPLAN_TIME_DEPENDENT_MAX_STATES:250000}
      max-search-duration: ${ROUTEPLAN_TIME_DEPENDENT_MAX_SEARCH_DURATION:5s}
  google:
    browser-key: ${GOOGLE_MAPS_BROWSER_KEY:}
    monthly-search-limit: ${GOOGLE_MONTHLY_SEARCH_LIMIT:4000}
    monthly-details-limit: ${GOOGLE_MONTHLY_DETAILS_LIMIT:900}
    monthly-matrix-limit: ${GOOGLE_MONTHLY_MATRIX_LIMIT:9000}
    monthly-geometry-limit: ${GOOGLE_MONTHLY_GEOMETRY_LIMIT:9000}
    api-key: ${GOOGLE_MAPS_API_KEY:}
    places-base-url: ${GOOGLE_PLACES_BASE_URL:https://places.googleapis.com}
    routes-base-url: ${GOOGLE_ROUTES_BASE_URL:https://routes.googleapis.com}
    connect-timeout: 2s
    request-timeout: 8s
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-5.4-mini}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com}
    connect-timeout: 2s
    request-timeout: 15s
