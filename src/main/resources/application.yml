spring:
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  application:
    name: routeplan
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/routeplan}
    username: ${SPRING_DATASOURCE_USERNAME:routeplan}
    password: ${SPRING_DATASOURCE_PASSWORD:routeplan-local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 500ms
      timeout: 500ms

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  shutdown: graceful
  servlet:
    session:
      timeout: ${ROUTEPLAN_SESSION_TIMEOUT:12h}
      cookie:
        name: ROUTEPLAN_SESSION
        http-only: true
        secure: ${ROUTEPLAN_SESSION_COOKIE_SECURE:false}
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  health:
    redis:
      enabled: false
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: ${spring.application.name}
    description: Constraint-aware travel route planning platform

logging:
  pattern:
    level: "%5p [cid:%X{correlationId:-none}]"

routeplan:
  community:
    moderator-emails: ${ROUTEPLAN_MODERATOR_EMAILS:}
  external:
    retry:
      enabled: ${ROUTEPLAN_EXTERNAL_RETRY_ENABLED:true}
      max-attempts: ${ROUTEPLAN_EXTERNAL_RETRY_MAX_ATTEMPTS:3}
      initial-delay: ${ROUTEPLAN_EXTERNAL_RETRY_INITIAL_DELAY:200ms}
      max-delay: ${ROUTEPLAN_EXTERNAL_RETRY_MAX_DELAY:2s}
      multiplier: ${ROUTEPLAN_EXTERNAL_RETRY_MULTIPLIER:2.0}
      jitter: ${ROUTEPLAN_EXTERNAL_RETRY_JITTER:0.2}
  ai:
    provider: ${ROUTEPLAN_AI_PROVIDER:RULE_BASED}
  place:
    provider: ${ROUTEPLAN_PLACE_PROVIDER:DISABLED}
  route:
    provider: ${ROUTEPLAN_ROUTE_PROVIDER:SIMPLE}
    cache:
      enabled: ${ROUTEPLAN_ROUTE_CACHE_ENABLED:false}
      key-prefix: ${ROUTEPLAN_ROUTE_CACHE_KEY_PREFIX:routeplan:route:v1}
      walking-ttl: ${ROUTEPLAN_ROUTE_CACHE_WALKING_TTL:7d}
      driving-ttl: ${ROUTEPLAN_ROUTE_CACHE_DRIVING_TTL:15m}
      transit-ttl: ${ROUTEPLAN_ROUTE_CACHE_TRANSIT_TTL:5m}
  google:
    browser-key: ${GOOGLE_MAPS_BROWSER_KEY:}
    monthly-search-limit: ${GOOGLE_MONTHLY_SEARCH_LIMIT:4000}
    monthly-details-limit: ${GOOGLE_MONTHLY_DETAILS_LIMIT:900}
    monthly-matrix-limit: ${GOOGLE_MONTHLY_MATRIX_LIMIT:9000}
    monthly-geometry-limit: ${GOOGLE_MONTHLY_GEOMETRY_LIMIT:9000}
    api-key: ${GOOGLE_MAPS_API_KEY:}
    places-base-url: ${GOOGLE_PLACES_BASE_URL:https://places.googleapis.com}
    routes-base-url: ${GOOGLE_ROUTES_BASE_URL:https://routes.googleapis.com}
    connect-timeout: 2s
    request-timeout: 8s
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-5.4-mini}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com}
    connect-timeout: 2s
    request-timeout: 15s
