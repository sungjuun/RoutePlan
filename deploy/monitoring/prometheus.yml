global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: routeplan
    environment: __ROUTEPLAN_DEPLOYMENT_ENVIRONMENT__

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: routeplan-backend
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names:
          - backend
        type: A
        port: 9090
        refresh_interval: 10s

  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9090

  - job_name: alertmanager
    static_configs:
      - targets:
          - alertmanager:9093
