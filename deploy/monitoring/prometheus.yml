global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: routeplan
    environment: production

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: routeplan-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - backend:9090

  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9090

  - job_name: alertmanager
    static_configs:
      - targets:
          - alertmanager:9093
