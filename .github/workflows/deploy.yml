name: RoutePlan Deploy
run-name: Deploy ${{ inputs.target_environment }} · ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: GitHub Environment and remote deployment target
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      confirmation:
        description: Type DEPLOY_STAGING or DEPLOY_PRODUCTION for the selected target
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: routeplan-${{ inputs.target_environment }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Require explicit main deployment
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        run: |
          test "$GITHUB_REF" = 'refs/heads/main'
          case "$TARGET_ENVIRONMENT" in
            staging) test "$CONFIRMATION" = 'DEPLOY_STAGING' ;;
            production) test "$CONFIRMATION" = 'DEPLOY_PRODUCTION' ;;
            *) exit 1 ;;
          esac
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Run backend tests
        run: ./gradlew test --no-daemon
      - name: Run frontend checks
        working-directory: frontend
        run: |
          npm ci
          npm test -- --run
          npm run lint
          npm run build
      - name: Validate production configuration
        run: bash ./scripts/check-production-config.sh

  publish:
    name: Publish release images
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image_prefix: ${{ steps.image.outputs.image_prefix }}
    steps:
      - uses: actions/checkout@v7
      - id: image
        name: Resolve lowercase GHCR image prefix
        shell: bash
        run: echo "image_prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.image.outputs.image_prefix }}-backend:${{ github.sha }}
          cache-from: type=gha,scope=routeplan-backend
          cache-to: type=gha,mode=max,scope=routeplan-backend
          provenance: true
          sbom: true
      - name: Publish frontend
        uses: docker/build-push-action@v7
        with:
          context: frontend
          file: frontend/Dockerfile.production
          push: true
          tags: ${{ steps.image.outputs.image_prefix }}-frontend:${{ github.sha }}
          cache-from: type=gha,scope=routeplan-frontend
          cache-to: type=gha,mode=max,scope=routeplan-frontend
          provenance: true
          sbom: true

  deploy:
    name: Deploy ${{ inputs.target_environment }}
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ inputs.target_environment }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure pinned SSH host
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_SSH_PRIVATE_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
      - name: Deploy immutable release and verify health
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          IMAGE_PREFIX: ${{ needs.publish.outputs.image_prefix }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_PATH"
          port="${DEPLOY_PORT:-22}"
          # Expansion of git status is intentionally deferred to the remote shell.
          # shellcheck disable=SC2016
          printf -v remote_command \
            'cd %q && test -z "$(git status --porcelain --untracked-files=no)" && git fetch --no-tags origin %q && git checkout --detach %q && ROUTEPLAN_EXPECTED_DEPLOYMENT_ENV=%q bash ./scripts/preflight-deployment-host.sh && ROUTEPLAN_EXPECTED_DEPLOYMENT_ENV=%q bash ./scripts/deploy-production.sh %q %q' \
            "$DEPLOY_PATH" "$GITHUB_SHA" "$GITHUB_SHA" "$TARGET_ENVIRONMENT" \
            "$TARGET_ENVIRONMENT" "$GITHUB_SHA" "$IMAGE_PREFIX"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$port" \
            "$DEPLOY_USER@$DEPLOY_HOST" "$remote_command"
